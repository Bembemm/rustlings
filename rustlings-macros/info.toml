# SEMÂNTICA DE MOVIMENTAÇÃO

[[exercises]]
name = "move_semantics1"
dir = "06_move_semantics"
hint = """
Você provavelmente recebeu o erro dizendo que `vec` não pode ser emprestado
como mutável porque não foi declarado como mutável.

A correção exige adicionar uma palavra-chave, mas NÃO na linha do `push`.

Depois, tente acessar `vec0` após chamar `fill_vec()` e observe o que acontece.
"""

[[exercises]]
name = "move_semantics2"
dir = "06_move_semantics"
hint = """
Na primeira execução, você verá um erro parecido com "borrow of moved value".

Quando um valor que possui seus dados é passado para uma função, a propriedade
pode ser movida para essa função. Ao passar `vec0` para `fill_vec`, você não
pode mais usar `vec0` depois.

Uma solução é criar outra cópia independente dos dados antes de passá-los.
Em Rust, isso pode ser feito com `clone`.
"""

[[exercises]]
name = "move_semantics3"
dir = "06_move_semantics"
hint = """
A diferença para os exercícios anteriores é que a linha
`let mut vec = vec;` desapareceu.

Em vez de adicioná-la novamente, você pode colocar `mut` em outro lugar para
fazer com que um binding existente já seja mutável.
"""

[[exercises]]
name = "move_semantics4"
dir = "06_move_semantics"
hint = """
Analise cuidadosamente por quanto tempo cada referência mutável permanece em
escopo. Ajuda modificar `x` logo depois de obter a referência mutável?

Leia mais:
https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references
"""

[[exercises]]
name = "move_semantics5"
dir = "06_move_semantics"
test = false
hint = """
Consulte a seção "References and Borrowing":
https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html

O primeiro problema é que `get_char` está assumindo a propriedade da string.
Assim, `data` é movido e não pode mais ser usado por `string_uppercase`.

Depois de corrigir isso, a assinatura de `string_uppercase` também precisará
ser ajustada.
"""

# ESTRUTURAS (`structs`)

[[exercises]]
name = "structs1"
dir = "07_structs"
hint = """
Rust possui três formas principais de struct.

- Structs tradicionais: coleções de campos nomeados.
- Tuple structs: semelhantes a tuplas, mas com um nome de tipo.
- Unit structs: não possuem campos e podem ser úteis em situações genéricas.

Neste exercício, você precisa completar uma de cada tipo.

Leia mais:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html
"""

[[exercises]]
name = "structs2"
dir = "07_structs"
hint = """
Criar uma instância de uma struct é simples: basta atribuir valores aos campos.

