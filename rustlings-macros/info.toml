[[exercises]]
name = "iterators2"
dir = "18_iterators"
hint = """
Para `capitalize_first`:
- `first` é um `char`;
- transforme-o em maiúsculo;
- depois combine-o com os caracteres restantes de `chars`.

Você pode enxergar o restante de `chars` como `&str` usando `as_str()`.
Veja também `char::to_uppercase`.

Para `capitalize_words_vector`:
- crie um iterador sobre o slice;
- transforme cada elemento com `capitalize_first`;
- use `collect`.

Para `capitalize_words_string`, a ideia é muito parecida. O ponto principal é
informar ao Rust qual tipo final você quer obter ao coletar o iterador.
