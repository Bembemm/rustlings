# TRATAMENTO DE ERROS

[[exercises]]
name = "errors1"
dir = "13_error_handling"
hint = """
`Ok` e `Err` são as duas variantes de `Result`. Os testes indicam que
`generate_nametag_text` deve retornar um `Result` em vez de um `Option`.

Para fazer essa mudança:
- altere o tipo de retorno para `Result<String, String>`;
- onde hoje há `Some(...)`, retorne `Ok(...)`;
- onde hoje há `None`, retorne `Err(mensagem_de_erro)`.
"""

[[exercises]]
name = "errors2"
dir = "13_error_handling"
hint = """
Uma forma de tratar o resultado de `item_quantity.parse::<i32>()` seria usar
um `match` com os casos `Ok(...)` e `Err(...)`.

Esse padrão é tão comum que Rust possui o operador `?`, que propaga o erro
automaticamente.

Leia mais:
https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator
"""

[[exercises]]
name = "errors3"
dir = "13_error_handling"
test = false
hint = """
Se outras funções podem retornar `Result`, por que `main` não poderia?

É comum escrever algo como `Result<(), ErrorType>` como retorno de `main`.

O tipo unitário `()` aparece porque, no caso de sucesso, não precisamos
retornar nenhum valor útil.
"""

[[exercises]]
name = "errors4"
dir = "13_error_handling"
hint = """
`PositiveNonzeroInteger::new` sempre cria uma instância e retorna `Ok`.

Mas ela deve verificar o valor recebido e retornar `Err` quando ele não puder
representar um inteiro positivo e diferente de zero.
"""

[[exercises]]
name = "errors5"
dir = "13_error_handling"
test = false
hint = """
Dentro de `main`, podem surgir dois tipos diferentes de erro, ambos
propagados com `?`. Como declarar um tipo de retorno capaz de representar
os dois?

Uma opção é usar um objeto de trait encaixotado: `Box<dyn Error>`. Como os
erros implementam a trait `Error`, tipos diferentes podem ser tratados por
essa mesma abstração.

Leia mais:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/boxing_errors.html
"""

[[exercises]]
name = "errors6"
dir = "13_error_handling"
hint = """
Este exercício reutiliza uma versão completa de `PositiveNonzeroInteger`.

Logo abaixo do TODO existe um exemplo de `map_err()`, que transforma um tipo
de erro em outro.

Tente aplicar a mesma ideia ao `Result` retornado por `parse()` e depois use
`?` para propagar o erro.

Documentação:
https://doc.rust-lang.org/std/result/enum.Result.html#method.map_err
