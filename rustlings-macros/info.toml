format_version = 1

welcome_message = """
É sua primeira vez? Não se preocupe: o Rustlings foi feito para iniciantes!
Vamos ensinar muita coisa sobre Rust, mas antes de começar, aqui estão algumas
informações importantes sobre como o Rustlings funciona:

1. A ideia central do Rustlings é resolver exercícios. Eles normalmente contêm
   erros de compilação ou de lógica que fazem o exercício falhar. Sua tarefa é
   encontrar e corrigir esses erros.
2. Mantenha seu editor aberto na pasta `rustlings/`. O Rustlings mostra o
   caminho do exercício atual abaixo da barra de progresso. Abra esse arquivo,
   corrija os erros e salve. O Rustlings detectará a alteração automaticamente
   e executará o exercício novamente. Quando tudo estiver correto, ele perguntará
   se você deseja avançar.
3. Se ficar preso em um exercício, digite `h` para exibir uma dica.
4. Se algum exercício não fizer sentido, você pode abrir uma issue no GitHub:
   https://github.com/rust-lang/rustlings
   A comunidade acompanha as issues e outros estudantes também podem ajudar."""

final_message = """
Esperamos que você tenha gostado de aprender os vários aspectos do Rust!
Se encontrar algum problema, fique à vontade para relatá-lo no GitHub.
Você também pode contribuir com seus próprios exercícios para ajudar a comunidade.

Antes de relatar um problema ou contribuir, leia as diretrizes:
https://github.com/rust-lang/rustlings/blob/main/CONTRIBUTING.md"""

