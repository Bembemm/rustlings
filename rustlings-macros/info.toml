de outra struct.

Leia mais:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html#creating-instances-from-other-instances-with-struct-update-syntax
"""

[[exercises]]
name = "structs3"
dir = "07_structs"
hint = """
Métodos e funções associadas são declarados dentro de um bloco `impl MyType {}`.

