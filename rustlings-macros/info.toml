# VARIÁVEIS

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
A declaração dentro de `main` está sem uma palavra-chave necessária
para criar uma nova variável em Rust.
"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
A mensagem do compilador diz que Rust não consegue inferir o tipo de `x`
com as informações disponíveis.

O que acontece se você adicionar uma anotação de tipo à primeira linha de
`main`?

E se atribuir um valor a `x`?

E se fizer as duas coisas?

Qual deveria ser o tipo de `x`?

O que muda se `x` tiver o mesmo tipo de `10`? E se tiver outro tipo?
"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
Neste exercício, criamos a variável `x` em `main` e tentamos usá-la
na linha seguinte, mas ainda não atribuímos nenhum valor a ela.

Não podemos imprimir algo que ainda não existe. Experimente dar um valor a `x`.

Esse tipo de erro é fácil de cometer em muitas linguagens; felizmente o
compilador Rust o detecta para nós.
"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
Em Rust, variáveis são imutáveis por padrão. Aqui estamos tentando atribuir
outro valor a `x`. Existe uma palavra-chave que torna a variável mutável.
"""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
Em `variables4`, aprendemos a tornar uma variável mutável. Isso não resolve
este exercício, pois aqui queremos reutilizar o mesmo nome com um valor de
outro tipo.

Rust possui uma solução chamada *shadowing* (sombreamento): você pode declarar
novamente uma variável com o mesmo nome.

Leia mais:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

Depois, tente resolver o exercício usando essa técnica.
"""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
Além de variáveis, Rust possui constantes.

Constantes são sempre imutáveis e são declaradas com `const` em vez de `let`.
O tipo de uma constante precisa ser informado explicitamente.

Leia mais:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants
"""

# FUNÇÕES

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
A função `main` está chamando uma função que deveria existir, mas ela ainda
não foi definida. O nome esperado é `call_me`, sem argumentos e sem valor de
retorno.

Isso se parece bastante com a própria `main`, não acha?
"""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
Rust exige anotações de tipo nos parâmetros de funções. Em `call_me`, está
faltando informar o tipo de `num`.
"""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
Desta vez, a declaração da função está correta. O problema está no lugar em
que a função é chamada.
"""

[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
A mensagem de erro aponta para `sale_price` e diz que falta um tipo depois
de `->`. É exatamente ali que informamos o tipo de retorno de uma função.

Veja `is_even` como exemplo.
"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
Este é um erro muito comum e pode ser corrigido removendo um único caractere.

Rust diferencia expressões de instruções (*statements*). Expressões produzem
um valor; instruções normalmente produzem `()`, semelhante a `void` em C/C++.

Queremos que `square` retorne um `i32`, mas ela está retornando `()`.

Há duas soluções:
1. Adicionar `return` antes de `num * num;`
2. Remover o ponto e vírgula depois de `num * num`
"""

# CONDICIONAIS (`if`)

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
Se quiser, é possível resolver isso em uma única linha.

Exemplos semelhantes em outras linguagens:
- C/C++: `a > b ? a : b`
- Python: `a if a > b else b`

Lembre-se de que em Rust:
- A condição do `if` não precisa de parênteses.
- `if`/`else` são expressões.
- Cada condição é seguida por um bloco `{}`.
"""

[[exercises]]
name = "if2"
dir = "03_if"
hint = """
Para o primeiro erro do compilador, lembre-se de que todos os blocos de uma
expressão condicional precisam produzir o mesmo tipo.

Para fazer os testes passarem, você precisará verificar alguns valores
diferentes. Leia os testes para descobrir o comportamento esperado.
"""

[[exercises]]
name = "if3"
dir = "03_if"
hint = """
Em Rust, todos os braços de uma expressão `if` precisam produzir valores do
mesmo tipo. Garanta que o tipo seja consistente em todos os caminhos.
"""

