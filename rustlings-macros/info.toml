# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
A declaração dentro de `main` está sem uma palavra-chave necessária
para criar uma nova variável em Rust.
"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
A mensagem do compilador diz que Rust não consegue inferir o tipo de `x`
com as informações disponíveis.

O que acontece se você adicionar uma anotação de tipo à primeira linha de
`main`?

E se atribuir um valor a `x`?

E se fizer as duas coisas?

Qual deveria ser o tipo de `x`?

O que muda se `x` tiver o mesmo tipo de `10`? E se tiver outro tipo?
"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
Neste exercício, criamos a variável `x` em `main` e tentamos usá-la
na linha seguinte, mas ainda não atribuímos nenhum valor a ela.

Não podemos imprimir algo que ainda não existe. Experimente dar um valor a `x`.

Esse tipo de erro é fácil de cometer em muitas linguagens; felizmente o
compilador Rust o detecta para nós.
"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
Em Rust, variáveis são imutáveis por padrão. Aqui estamos tentando atribuir
outro valor a `x`. Existe uma palavra-chave que torna a variável mutável.
"""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
Em `variables4`, aprendemos a tornar uma variável mutável. Isso não resolve
este exercício, pois aqui queremos reutilizar o mesmo nome com um valor de
outro tipo.

Rust possui uma solução chamada *shadowing* (sombreamento): você pode declarar
novamente uma variável com o mesmo nome.

Leia mais:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

Depois, tente resolver o exercício usando essa técnica.
"""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
Além de variáveis, Rust possui constantes.

Constantes são sempre imutáveis e são declaradas com `const` em vez de `let`.
O tipo de uma constante precisa ser informado explicitamente.

Leia mais:
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants
"""

