[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
A mensagem de erro aponta para `sale_price` e diz que falta um tipo depois
de `->`. É exatamente ali que informamos o tipo de retorno de uma função.

Veja `is_even` como exemplo.
"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
Este é um erro muito comum e pode ser corrigido removendo um único caractere.

Rust diferencia expressões de instruções (*statements*). Expressões produzem
um valor; instruções normalmente produzem `()`, semelhante a `void` em C/C++.

Queremos que `square` retorne um `i32`, mas ela está retornando `()`.

Há duas soluções:
1. Adicionar `return` antes de `num * num;`
2. Remover o ponto e vírgula depois de `num * num`
"""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
Se quiser, é possível resolver isso em uma única linha.

Exemplos semelhantes em outras linguagens:
- C/C++: `a > b ? a : b`
- Python: `a if a > b else b`

Lembre-se de que em Rust:
- A condição do `if` não precisa de parênteses.
- `if`/`else` são expressões.
- Cada condição é seguida por um bloco `{}`.
"""

[[exercises]]
